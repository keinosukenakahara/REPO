<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzExyJxMiW15A4s2A_Vm5nuvQwlEmZv-g1RDU_eTxFBfxlYiajNp_x795_hCbogWcY/exec";
 

const POST_URL = API_URL;

let calendarData = [];

Math.floor(Math.random() * 5) + 1;

const modal = document.getElementById("modal");
const title = document.getElementById("menu-title");

whisky: {title:"ウイスキー",detail:"海外　国産",price:"700円〜"},

};

modal.style.display="block";

async function loadCalendar(){
 
    try{

        const response =
        await fetch(API_URL);

        calendarData =
        await response.json();

        console.log(calendarData);

// ★追加
console.table(calendarData);




    }catch(error){

        console.error(error);

        alert("営業データ取得失敗");

    }

}



function showTodayRemain(){

    const today = new Date();

    const yyyy = today.getFullYear();

    const mm = String(today.getMonth()+1).padStart(2,"0");

    const dd = String(today.getDate()).padStart(2,"0");

    <!--
    const todayStr = `${yyyy}-${mm}-${dd}`;

    const dayData = calendarData.find(d => d.date === todayStr);
     -->


// ★追加
console.log(
    "todayStr:",
    todayStr,
    "dayData:",
    dayData
);



    if(dayData){

        document.getElementById("seats").textContent =
        dayData.remain;

    }else{

        document.getElementById("seats").textContent =
        "-";

    }

}


window.addEventListener("load", async ()=>{

    await loadCalendar();

console.log(calendarData);
console.log(calendarData.slice(0,10));
    
    showTodayRemain();

    /* Flatpickr生成 */

    flatpickr("#reservationDate", {

        dateFormat: "Y-m-d",

        minDate: "today",

        disable: [

            function(date){

                return false;

            }

        ],

        onDayCreate: function(dObj, dStr, fp, dayElem){

            // 既存の残席表示を完全削除
            const old =
            dayElem.querySelector(".remain");

            if(old){
                old.remove();
            }

            const date =
            dayElem.dateObj;


            const formatted =
            `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;


            // ★追加：過去日は残席表示しない
            const today = new Date();

            today.setHours(0,0,0,0);


            if(date < today){

                return;

            }





            const dayData =
            calendarData.find(
                d => d.date === formatted
            );


            console.log(
                "表示日=",
                formatted,
                "残席=",
                dayData ? dayData.remain : "なし"
            );


            if(!dayData) return;


            // 休店日
            if (dayData.open != "営業") {

                dayElem.classList.add("closed-day");

                // 残席は表示しない
                return;
            }

            // 満席
            if (Number(dayData.remain) <= 0) {

                dayElem.classList.add("full-day");
            }

            const remain = document.createElement("span");

            remain.className = "remain";
            remain.textContent = `残${dayData.remain}席`;

            dayElem.appendChild(remain);
        }
    });

});

/* 営業時間制限 */

const reservationDate =
document.getElementById("reservationDate");






reservationDate.addEventListener("change", function(){

    const selectedDate = this.value;

    if(!selectedDate) return;

    const selected =
    new Date(selectedDate);

    const day =
    selected.getDay();


    /* スプレッド検索 */

    console.log("selectedDate", selectedDate);
    console.log("calendarData", calendarData);

    const dayData =
    calendarData.find(d => d.date === selectedDate);

 
    console.log("dayData", dayData);

    if(!dayData){

        alert("営業情報がありません");

        this.value = "";

        return;
    }

    /* 店休日 */

    if(dayData.open != "営業"){

        alert("休業日です");

        this.value = "";

        return;

    }


    /* 満席 */

    if(Number(dayData.remain) <= 0){

        alert("満席です");

        this.value = "";

        return;
    }

    /* 残席表示 */

    document.getElementById("seats").textContent =
    dayData.remain;

    /* 営業時間生成 */

    createTimeOptions(
        dayData.start,
        dayData.end
    );

});











/* 過去日禁止 */

const today = new Date();

today.setMinutes(
today.getMinutes() - today.getTimezoneOffset()
);

document.getElementById("reservationDate").min =
today.toISOString().split("T")[0];

/* submit時 */

document.querySelector("form")
.addEventListener("submit",function(e){

    e.preventDefault();

    const date =
    document.getElementById("reservationDate").value;

    const start =
    document.getElementById("startHour").value;

    const end =
    document.getElementById("endHour").value;

    /* 未選択 */

    if(!date || !start || !end){

    alert("予約日時を選択してください");

    e.preventDefault();

    return;

}

/* 開始・終了チェック */

if(start >= end){

alert("終了時間は開始時間より後にしてください");

e.preventDefault();

return;

}

/* hiddenへ格納 */

document.getElementById("datetime").value =
`${date} ${start} ～ ${end}`;

/* 日曜チェック */

const selected = new Date(date);




const formData = new FormData();

formData.append("date", date);

formData.append(

);

formData.append(
    "phone",

formData.append(

);

formData.append(
    "message",
    document.querySelector("[name='message']").value
);

fetch(POST_URL,{
    method:"POST",
    body:formData
})
.then(res=>res.json())
.then(data=>{

    console.log(data);

    if(data.result === "success"){

        window.location.href = "thanks.html";

    }else{

        alert("予約保存に失敗しました。\n" + data.message);

    }

})
.catch(err=>{

    console.error(err);

    alert("通信エラーが発生しました。");

});

});   // ← submitイベント終了











function createTimeOptions(start, end){

    const startSelect =
    document.getElementById("startHour");

    const endSelect =
    document.getElementById("endHour");

    startSelect.innerHTML =
    '<option value="">開始時間</option>';

    endSelect.innerHTML =
    '<option value="">終了時間</option>';

    /* 文字列化 */

    start = String(start).substring(0,5);
    end = String(end).substring(0,5);

    console.log(start, end);

    let startHour =
    parseInt(start.split(":")[0]);

    let endHour =
    parseInt(end.split(":")[0]);

    /* 24:00対策 */

    if(endHour === 24){
        endHour = 23;
    }

    for(let h = startHour; h <= endHour; h++){

        for(let m of ["00","30"]){

            /* 23:30で終了 */

            if(h === 23 && m === "30"){
                continue;
            }

            const time =
            `${String(h).padStart(2,"0")}:${m}`;

            const startOption =
            document.createElement("option");

            startOption.value = time;
            startOption.textContent = time;

            startSelect.appendChild(startOption);

            const endOption =
            document.createElement("option");

            endOption.value = time;
            endOption.textContent = time;

            endSelect.appendChild(endOption);

        }

    }

}







/* 日時表示更新 */

function updateDateTimeDisplay(){

const date =
document.getElementById("reservationDate").value;

const start =
document.getElementById("startHour").value;

const end =
document.getElementById("endHour").value;

if(date && start && end){

const datetimeValue =
`${date} ${start} ～ ${end}`;

document.getElementById("datetime").value =
datetimeValue;

document.getElementById("datetimeDisplay").value =
datetimeValue;

}

}



/* イベント */

document.getElementById("reservationDate")
.addEventListener("change", updateDateTimeDisplay);

document.getElementById("startHour")
.addEventListener("change", updateDateTimeDisplay);

document.getElementById("endHour")
.addEventListener("change", updateDateTimeDisplay);





</script>
